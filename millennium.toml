[plugin]
id = "com.luatools.manifest-backup"
name = "LuaTools Manifest Backup"
version = "1.2.0"
author = "emanoeltosta2"
description = "Backup local e no Google Drive dos jogos adicionados pelo LuaTools."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"
